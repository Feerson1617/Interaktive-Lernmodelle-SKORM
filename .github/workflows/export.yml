name: SCORM exportieren
on:
  pull_request:
    branches: [main]
    paths:
      - 'modelle/sinnblick/**'
      - 'configs/sinnblick.json'
      - 'scripts/**'
      - 'tests/**'
      - 'playwright*.js'
      - '.github/workflows/export.yml'
      - 'package*.json'
  workflow_dispatch:
    inputs:
      config:
        description: Konfiguration (scorm.config.json oder configs/sinnblick.json; auch eigene Pfade möglich)
        required: true
        default: scorm.config.json
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TEST_WEBKIT: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: npm ci
      - run: python3 -m pip install -r requirements.txt
      - run: npx playwright install --with-deps chromium webkit
      - name: Referenztests, konfigurierter Export und Startprüfung
        run: node scripts/workflow-build.mjs
        env:
          SCORM_CONFIG: ${{ inputs.config || 'configs/sinnblick.json' }}
      - name: Import-ZIP-Dateinamen aus dem geprüften Build übernehmen
        id: export_file
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          output = json.loads(Path('.build/selected.json').read_text())['output']
          assert output == Path(output).name and output.endswith('.zip'), output
          files = list(Path('.build/export').iterdir())
          assert len(files) == 1 and files[0].is_file() and files[0].name == output, files
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"filename={output}\n")
          PY
      - name: Fertige SCORM-ZIP DIREKT ohne weitere ZIP-Schicht hochladen
        uses: actions/upload-artifact@v7
        id: export
        with:
          path: .build/export/${{ steps.export_file.outputs.filename }}
          archive: false
          if-no-files-found: error
          retention-days: 90
      - name: Exakte Direktdatei zur Kontrolle zurückladen
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.export_file.outputs.filename }}
          path: .build/download
      - run: python3 scripts/check-download.py
      - name: Exakte Importanleitung
        env:
          DOWNLOAD: ${{ steps.export.outputs.artifact-url }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          name = json.loads(Path('.build/selected.json').read_text())['output']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(f"[{name} direkt herunterladen]({os.environ['DOWNLOAD']})\n\n")
              out.write(f"**Direkt heruntergeladenes `{name}` unverändert in itslearning importieren.** Kein Entpacken und kein erneutes Komprimieren. `imsmanifest.xml` liegt im ZIP-Hauptverzeichnis; die direkt veröffentlichte Datei wurde nach dem Rückdownload byteweise geprüft.\n\n")
              out.write("Automatisierte Tests ersetzen keinen echten itslearning-Import oder physischen iPad-Test.\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Export-Testnachweise
          path: test-results/
          overwrite: true
          retention-days: 90
